<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tel2gram</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: #0e1621; color: #fff; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }

  .screen { display: none; height: 100%; flex-direction: column; flex: 1; }
  .screen.active { display: flex; }
  
  #screen-login { justify-content: center; align-items: center; padding: 20px; }

  .box { width: 100%; max-width: 350px; text-align: center; }
  .logo { color: #5eb5f7; font-size: 40px; font-weight: bold; margin-bottom: 10px; }
  .subtitle { color: #7d8b99; font-size: 15px; margin-bottom: 20px; }

  input { width: 100%; padding: 15px; border-radius: 8px; border: 1px solid #242f3d; background: #17212b; color: #fff; font-size: 16px; margin-bottom: 15px; outline: none; text-align: center; }
  input:focus { border-color: #5eb5f7; }

  .btn { display: block; width: 100%; padding: 15px; background: #5eb5f7; color: #fff; border-radius: 8px; font-weight: bold; font-size: 16px; border: none; cursor: pointer; }

  .top-bar { height: 60px; background: #17212b; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; border-bottom: 1px solid #242f3d; flex-shrink: 0; }
  .top-bar-title { font-size: 18px; color: #5eb5f7; font-weight: bold; }
  
  .add-btn-circle { width: 40px; height: 40px; border-radius: 50%; background: #5eb5f7; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 26px; font-weight: bold; cursor: pointer; }
  
  .chat-list { width: 100%; padding: 20px 15px; flex: 1; overflow-y: auto; }
  .contact-item { display: flex; align-items: center; gap: 15px; background: #17212b; padding: 15px; border-radius: 10px; margin-bottom: 10px; cursor: pointer; }
  .contact-avatar { width: 50px; height: 50px; border-radius: 50%; background: #5eb5f7; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; color: #fff; }
  .contact-info { display: flex; flex-direction: column; gap: 5px; }
  .contact-name { font-size: 16px; font-weight: bold; }
  .contact-last { font-size: 13px; color: #7d8b99; }

  .messages { flex: 1; overflow-y: auto; padding: 20px 15px; display: flex; flex-direction: column; gap: 10px; }
  .msg-row { display: flex; align-items: flex-end; gap: 8px; max-width: 85%; }
  .msg-row.me { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.them { align-self: flex-start; }
  .msg { padding: 10px 15px; border-radius: 12px; font-size: 14px; word-wrap: break-word; }
  .msg.me { background: #2b5278; }
  .msg.them { background: #182533; }
  
  .input-bar { height: 60px; padding: 10px 15px; background: #17212b; display: flex; gap: 10px; border-top: 1px solid #242f3d; flex-shrink: 0; }
  .input-bar input { flex: 1; margin: 0; text-align: left; border-radius: 20px; background: #0b0c10; border: 1px solid #2a2e39; padding: 10px 15px; font-size: 16px; }
  .send-btn { background: #5eb5f7; width: 45px; height: 40px; border-radius: 50%; color: #fff; border: none; font-size: 20px; font-weight: bold; cursor: pointer;}
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="screen-login" class="screen active">
  <div class="box">
    <div class="logo">Tel2gram</div>
    <div class="subtitle">Вход в настоящий мессенджер</div>
    <input type="text" id="inputId" placeholder="Придумайте свой ID (например: vanya777)">
    <button class="btn" onclick="login()">Войти</button>
  </div>
</div>

<!-- ЭКРАН ЧАТОВ -->
<div id="screen-chats" class="screen">
  <div class="top-bar">
    <div class="top-bar-title">Чаты</div>
    <div class="add-btn-circle" onclick="addFriend()">+</div>
  </div>
  <div class="chat-list" id="chat-list">
    <!-- Контакт Tel2gram -->
    <div class="contact-item" onclick="openChat('tel2gram')">
      <div class="contact-avatar" style="background:#5eb5f7;">T</div>
      <div class="contact-info">
        <div class="contact-name">Tel2gram</div>
        <div class="contact-last">Добро пожаловать в Tel2gram</div>
      </div>
    </div>
  </div>
</div>

<!-- ЭКРАН ДИАЛОГА -->
<div id="screen-dialog" class="screen">
  <div class="top-bar">
    <div style="cursor:pointer; color:#5eb5f7; font-size:20px; padding-right:10px;" onclick="backToChats()">←</div>
    <div class="top-bar-title" id="chat-title">Чат</div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="input-bar">
    <input type="text" id="msg-input" placeholder="Сообщение...">
    <button class="send-btn" onclick="sendMsg()">➤</button>
  </div>
</div>

<!-- ПОДКЛЮЧЕНИЕ К FIREBASE -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded, set, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  // ТВОИ ДАННЫЕ ИЗ FIREBASE
  const firebaseConfig = {
    apiKey: "AIzaSyDlb5ZzTvRvO6TA3ZtwooeXP9ORAm3SE3w",
    authDomain: "tel2gram-f4181.firebaseapp.com",
    databaseURL: "https://tel2gram-f4181-default-rtdb.firebaseio.com/",
    projectId: "tel2gram-f4181",
    storageBucket: "tel2gram-f4181.firebasestorage.app",
    messagingSenderId: "527717815195",
    appId: "1:527717815195:web:e63d8b55b54decc311c73e",
    measurementId: "G-GSW3HCPYCX"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  let myId = "";
  let currentChatId = "";
  let friends = [];

  // Вход
  window.login = async function() {
    let id = document.getElementById('inputId').value.trim().toLowerCase();
    if (!id) return alert("Введите ID!");

    // Проверяем, занят ли ID
    const snapshot = await get(child(ref(db), `users/${id}`));
    if (snapshot.exists() && !localStorage.getItem('tel2gram_my_id')) {
      return alert("Этот ID уже занят! Придумайте другой.");
    }

    myId = id;
    localStorage.setItem('tel2gram_my_id', myId);

    await set(ref(db, `users/${id}`), { online: true });

    document.getElementById('screen-login').classList.remove('active');
    document.getElementById('screen-chats').classList.add('active');
    loadFriends();
  };

  // Загрузка друзей
  window.loadFriends = function() {
    let saved = localStorage.getItem('tel2gram_friends_list');
    if (saved) friends = JSON.parse(saved);
    renderChats();
  };

  window.addFriend = async function() {
    let friendId = prompt("Введите ID друга:");
    if (!friendId) return;
    friendId = friendId.trim().toLowerCase();

    if (friendId === myId) return alert("Это ваш ID!");
    if (friends.includes(friendId)) return alert("Уже в друзьях!");

    // Проверяем, существует ли пользователь
    const snapshot = await get(child(ref(db), `users/${friendId}`));
    if (!snapshot.exists()) {
      return alert("Пользователь не найден! Пусть он сначала зайдет в приложение.");
    }

    friends.push(friendId);
    localStorage.setItem('tel2gram_friends_list', JSON.stringify(friends));
    renderChats();
  };

  window.renderChats = function() {
    let list = document.getElementById('chat-list');
    list.innerHTML = `
      <div class="contact-item" onclick="openChat('tel2gram')">
        <div class="contact-avatar" style="background:#5eb5f7;">T</div>
        <div class="contact-info">
          <div class="contact-name">Tel2gram</div>
          <div class="contact-last">Добро пожаловать в Tel2gram</div>
        </div>
      </div>
    `;

    friends.forEach(friend => {
      list.innerHTML += `
        <div class="contact-item" onclick="openChat('${friend}')">
          <div class="contact-avatar" style="background:#e67e22;">${friend[0].toUpperCase()}</div>
          <div class="contact-info">
            <div class="contact-name">${friend}</div>
            <div class="contact-last">Нажмите, чтобы написать</div>
          </div>
        </div>
      `;
    });
  };

  window.openChat = function(friendId) {
    currentChatId = friendId;
    document.getElementById('screen-chats').classList.remove('active');
    document.getElementById('screen-dialog').classList.add('active');
    document.getElementById('chat-title').innerText = friendId === 'tel2gram' ? 'Tel2gram' : friendId;
    
    let box = document.getElementById('messages');
    box.innerHTML = '';

    if (friendId === 'tel2gram') {
      box.innerHTML = '<div class="msg them">Привет! Это настоящий мессенджер. Добавь друга по ID и напиши ему!</div>';
      return;
    }

    let chatId = [myId, friendId].sort().join('_');

    const messagesRef = ref(db, `chats/${chatId}/messages`);
    onChildAdded(messagesRef, (snapshot) => {
      const msg = snapshot.val();
      let div = document.createElement('div');
      div.className = 'msg-row ' + (msg.from === myId ? 'me' : 'them');
      div.innerHTML = `<div class="msg ${msg.from === myId ? 'me' : 'them'}">${msg.text}</div>`;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    });
  };

  window.backToChats = function() {
    document.getElementById('screen-dialog').classList.remove('active');
    document.getElementById('screen-chats').classList.add('active');
    document.getElementById('messages').innerHTML = '';
  };

  window.sendMsg = function() {
    let input = document.getElementById('msg-input');
    let text = input.value.trim();
    if (!text || !currentChatId || currentChatId === 'tel2gram') return;

    let chatId = [myId, currentChatId].sort().join('_');
    
    push(ref(db, `chats/${chatId}/messages`), {
      from: myId,
      text: text,
      time: Date.now()
    });

    input.value = '';
  };

  // Авто-вход
  let savedId = localStorage.getItem('tel2gram_my_id');
  if (savedId) {
    myId = savedId;
    document.getElementById('screen-login').classList.remove('active');
    document.getElementById('screen-chats').classList.add('active');
    loadFriends();
  }
</script>

</body>
</html>
